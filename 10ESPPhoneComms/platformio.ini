[env:default]
platform      = espressif32
board         = nodemcuv3
framework     = arduino

monitor_speed = 115200
upload_speed  = 115200

; WiFi + BluetoothClassic stacks together exceed the default.csv app slot
; (1.3 MB) -> huge_app.csv gives the app 3 MB (no OTA slots).
board_build.partitions = huge_app.csv

; No secrets needed: Bluetooth SPP + ESP-NOW need no WiFi credentials.
; Tunables (same as 09ESP2ESPCommunication, both boards!):
;   -D E2E_CHANNEL=6                      WiFi channel 1..13 (both boards!)
;   -D E2E_FRAME_MAX=240                  max ESP-NOW frame incl. 18 B header (<=250)
;   -D E2E_PSK=\"my-secret-key\"           pre-shared key (else NVS 'key' cmd / default)
build_flags  = -D LED_BUILTIN=2
