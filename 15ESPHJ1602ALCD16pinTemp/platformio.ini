[env:default]
platform      = espressif32
; nodemcu-32s is the stock ID in espressif32@6.x (same board as the
; nodemcuv3 used by the sibling projects, which needs a custom board JSON)
board         = nodemcu-32s
framework     = arduino

monitor_speed = 115200
upload_speed  = 115200

; secrets.h lives in _secrets/ (gitignored) - copy _secrets/secrets.example.h first
; no -D LED_BUILTIN=2 here: the stock nodemcu-32s variant already defines it (=2)
; in pins_arduino.h, and the macro would clash with that declaration
build_flags  = -I../_secrets

lib_deps     = arduino-libraries/LiquidCrystal@^1.0.7
               bblanchon/ArduinoJson@^7
