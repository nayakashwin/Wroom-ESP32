[env:default]
platform      = espressif32
board         = nodemcuv3
framework     = arduino

monitor_speed = 115200
upload_speed  = 115200

; secrets.h lives in _secrets/ (gitignored) - copy _secrets/secrets.example.h first
build_flags  = -D LED_BUILTIN=2 -I../_secrets

; getUpdates parsing (the grid is only sent when the user types /temp)
lib_deps     = bblanchon/ArduinoJson@^7

; BLE + WiFi + TLS together are ~1.69 MB, over the 1.25 MB app slot of
; default.csv. huge_app.csv gives the app 3.0 MB (no app1 -> no OTA, and
; spiffs shrinks to 896 KB); nvs / otadata / app0 offsets are unchanged, so
; the usual upload target still works.
board_build.partitions = huge_app.csv
