[env:default]
platform      = espressif32
board         = nodemcuv3
framework     = arduino

monitor_speed = 115200
upload_speed  = 115200

; No secrets needed: ESP-NOW needs no WiFi credentials (the pre-shared key is
; a serial `key` command or -D E2E_PSK, see README). Tunables (both boards!):
;   -D E2E_CHANNEL=6                WiFi channel 1..13 (both boards!)
;   -D E2E_FRAME_MAX=250            max ESP-NOW frame incl. 18 B header (<=250)
;   -D E2E_PSK=\"my-secret-key\"     pre-shared key (else NVS 'key' cmd / default)
;   -D E2E_PHY_RATE=WIFI_PHY_RATE_1M_L  PHY rate (this fork defaults to 1M for
;                                    max range; runtime 'rate' command wins)
build_flags  = -D LED_BUILTIN=2
