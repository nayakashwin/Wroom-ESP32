[env:default]
platform      = espressif32
board         = nodemcuv3
framework     = arduino

monitor_speed = 115200
upload_speed  = 115200

; No secrets needed: ESP-NOW is device-to-device, no WiFi credentials.
; Tunables (see README.md "Configuration"):
;   -D E2E_CHANNEL=6                      WiFi channel 1..13 (both boards!)
;   -D E2E_FRAME_MAX=240                  max ESP-NOW frame incl. 18 B header (<=250)
;   -D E2E_PSK=\"my-secret-key\"           pre-shared key (else NVS 'key' cmd / default)
;   -D E2E_PHY_RATE=WIFI_PHY_RATE_11M_S -D E2E_FRAME_MAX=250     PHY rate, default WIFI_PHY_RATE_MCS7_SGI
;   -D E2E_AUTO_BENCH=0                   disable the once-per-boot pairing benchmark
;   -D E2E_AUTO_BENCH_KB=128              benchmark size in KB
build_flags  = -D LED_BUILTIN=2
